<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Cashier Trainer</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .chip {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            font-size: 1.2rem;
            flex-shrink: 0; /* Prevent chips from shrinking */
        }
        .chip-count {
            font-size: 0.8rem;
            margin-top: -5px;
            color: #333;
        }
        /* Chip colors */
        .chip-1 { background-color: #ffffff; color: #333; border-color: #cccccc; } /* White */
        .chip-5 { background-color: #ff0000; } /* Red */
        .chip-25 { background-color: #008000; } /* Green */
        .chip-100 { background-color: #0000ff; } /* Blue */
        .chip-500 { background-color: #800080; } /* Purple */
        .chip-1000 { background-color: #000000; } /* Black */

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-xl max-w-2xl w-full">
        <h1 class="text-3xl font-extrabold text-center text-gray-800 mb-6">💰 Casino Cashier Trainer 💰</h1>

        <div class="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <h2 class="text-xl font-semibold text-blue-800 mb-3">Chips on the Table:</h2>
            <div id="chipsDisplay" class="chip-container">
                <!-- Chips will be dynamically added here -->
            </div>
        </div>

        <div class="mb-6">
            <label for="totalValueInput" class="block text-lg font-medium text-gray-700 mb-2">
                Total Chip Value ($):
            </label>
            <input type="number" id="totalValueInput" class="mt-1 block w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg" placeholder="e.g., 12345" min="0">
        </div>

        <div class="mb-6 p-4 bg-green-50 rounded-lg border border-green-200">
            <h2 class="text-xl font-semibold text-green-800 mb-3">Money to Give Out (Bills):</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                <div>
                    <label for="bill100" class="block text-sm font-medium text-gray-700">$100 Bills:</label>
                    <input type="number" id="bill100" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
                <div>
                    <label for="bill50" class="block text-sm font-medium text-gray-700">$50 Bills:</label>
                    <input type="number" id="bill50" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
                <div>
                    <label for="bill20" class="block text-sm font-medium text-gray-700">$20 Bills:</label>
                    <input type="number" id="bill20" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
                <div>
                    <label for="bill10" class="block text-sm font-medium text-gray-700">$10 Bills:</label>
                    <input type="number" id="bill10" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
                <div>
                    <label for="bill5" class="block text-sm font-medium text-gray-700">$5 Bills:</label>
                    <input type="number" id="bill5" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
                <div>
                    <label for="bill1" class="block text-sm font-medium text-gray-700">$1 Bills:</label>
                    <input type="number" id="bill1" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm text-base" value="0" min="0">
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-center gap-4 mb-6">
            <button id="checkButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                Check Answer
            </button>
            <button id="resetButton" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                Reset
            </button>
        </div>

        <!-- New section for statistics -->
        <div class="mb-6 p-4 bg-purple-50 rounded-lg border border-purple-200">
            <h2 class="text-xl font-semibold text-purple-800 mb-3">Your Progress:</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="p-2 bg-purple-100 rounded-md">
                    <p class="text-sm font-medium text-purple-700">Games Played:</p>
                    <p id="gamesPlayed" class="text-2xl font-bold text-purple-900">0</p>
                </div>
                <div class="p-2 bg-green-100 rounded-md">
                    <p class="text-sm font-medium text-green-700">Correct Answers:</p>
                    <p id="correctAnswers" class="text-2xl font-bold text-green-900">0</p>
                </div>
                <div class="p-2 bg-red-100 rounded-md">
                    <p class="text-sm font-medium text-red-700">Incorrect Answers:</p>
                    <p id="incorrectAnswers" class="text-2xl font-bold text-red-900">0</p>
                </div>
            </div>
        </div>

        <div id="messageBox" class="p-4 rounded-md text-center text-lg font-semibold hidden">
            <!-- Messages will be displayed here -->
        </div>
    </div>

    <script>
        // Define casino chip denominations and their properties
        const chipDenominations = [
            { value: 1000, className: 'chip-1000', label: '$1000' },
            { value: 500, className: 'chip-500', label: '$500' },
            { value: 100, className: 'chip-100', label: '$100' },
            { value: 25, className: 'chip-25', label: '$25' },
            { value: 5, className: 'chip-5', label: '$5' },
            { value: 1, className: 'chip-1', label: '$1' }
        ];

        // Define money bill denominations
        const billDenominations = [100, 50, 20, 10, 5, 1];

        // Get DOM elements
        const chipsDisplay = document.getElementById('chipsDisplay');
        const totalValueInput = document.getElementById('totalValueInput');
        const checkButton = document.getElementById('checkButton');
        const resetButton = document.getElementById('resetButton');
        const messageBox = document.getElementById('messageBox');

        // Get DOM elements for statistics
        const gamesPlayedDisplay = document.getElementById('gamesPlayed');
        const correctAnswersDisplay = document.getElementById('correctAnswers');
        const incorrectAnswersDisplay = document.getElementById('incorrectAnswers');

        // Store the correct total value for the current round
        let correctTotalValue = 0;

        // Statistics variables
        let gamesPlayed = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;

        /**
         * Generates a random integer between min and max (inclusive).
         * @param {number} min - The minimum value.
         * @param {number} max - The maximum value.
         * @returns {number} A random integer.
         */
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        /**
         * Clears all input fields and message box.
         */
        function clearInputs() {
            totalValueInput.value = '';
            billDenominations.forEach(bill => {
                document.getElementById(`bill${bill}`).value = 0;
            });
            messageBox.textContent = '';
            messageBox.classList.add('hidden');
            messageBox.classList.remove('bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
        }

        /**
         * Displays a message in the message box.
         * @param {string} message - The message to display.
         * @param {boolean} isCorrect - True if the message is for a correct answer, false otherwise.
         */
        function displayMessage(message, isCorrect) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden');
            if (isCorrect) {
                messageBox.classList.remove('bg-red-100', 'text-red-800');
                messageBox.classList.add('bg-green-100', 'text-green-800');
            } else {
                messageBox.classList.remove('bg-green-100', 'text-green-800');
                messageBox.classList.add('bg-red-100', 'text-red-800');
            }
        }

        /**
         * Updates the displayed statistics on the page.
         */
        function updateStatisticsDisplay() {
            gamesPlayedDisplay.textContent = gamesPlayed;
            correctAnswersDisplay.textContent = correctAnswers;
            incorrectAnswersDisplay.textContent = incorrectAnswers;
        }

        /**
         * Generates a new set of random chips and updates the display.
         */
        function generateNewRound() {
            chipsDisplay.innerHTML = ''; // Clear previous chips
            correctTotalValue = 0;
            const chipCounts = {};

            chipDenominations.forEach(chip => {
                // Generate a random count for each chip type (e.g., 0-5 for smaller, 0-2 for larger)
                const count = getRandomInt(0, chip.value >= 100 ? 2 : 5);
                chipCounts[chip.value] = count;
                correctTotalValue += chip.value * count;

                if (count > 0) {
                    const chipDiv = document.createElement('div');
                    chipDiv.className = `chip ${chip.className}`;
                    chipDiv.innerHTML = `<span>${chip.label}</span>`;

                    const countSpan = document.createElement('span');
                    countSpan.className = 'chip-count';
                    countSpan.textContent = `x${count}`;

                    const chipWrapper = document.createElement('div');
                    chipWrapper.className = 'flex flex-col items-center';
                    chipWrapper.appendChild(chipDiv);
                    chipWrapper.appendChild(countSpan);
                    chipsDisplay.appendChild(chipWrapper);
                }
            });
        }

        /**
         * Calculates the total value from user-entered bills.
         * @returns {number} The total value of bills entered by the user.
         */
        function calculateUserBillTotal() {
            let userBillTotal = 0;
            billDenominations.forEach(bill => {
                const inputElement = document.getElementById(`bill${bill}`);
                const count = parseInt(inputElement.value) || 0; // Default to 0 if empty or invalid
                userBillTotal += bill * count;
            });
            return userBillTotal;
        }

        /**
         * Calculates the optimal bill breakdown for a given amount.
         * @param {number} amount - The total amount to break down into bills.
         * @returns {Object} An object where keys are bill denominations and values are their counts.
         */
        function getOptimalBillBreakdown(amount) {
            let remainingAmount = amount;
            const breakdown = {};
            billDenominations.forEach(bill => {
                breakdown[bill] = 0; // Initialize count for each bill
            });

            // Iterate through denominations from largest to smallest
            for (const bill of billDenominations) {
                if (remainingAmount >= bill) {
                    const count = Math.floor(remainingAmount / bill);
                    breakdown[bill] = count;
                    remainingAmount -= count * bill;
                }
            }
            return breakdown;
        }

        /**
         * Event handler for the Check Answer button.
         */
        checkButton.addEventListener('click', () => {
            const userTotalValue = parseFloat(totalValueInput.value);
            const userBillTotal = calculateUserBillTotal();

            let isCorrect = true;
            let message = '';

            // Increment games played regardless of outcome
            gamesPlayed++;

            // Check total chip value
            if (isNaN(userTotalValue) || userTotalValue !== correctTotalValue) {
                isCorrect = false;
                message += `Incorrect total chip value. Expected: $${correctTotalValue.toLocaleString()}. `;
            }

            // Check money bill breakdown
            if (userBillTotal !== correctTotalValue) {
                isCorrect = false;
                message += `Incorrect total bill value. Your bills add up to $${userBillTotal.toLocaleString()}. Expected: $${correctTotalValue.toLocaleString()}. `;
            } else {
                // If total bill value is correct, check if the breakdown matches the optimal one
                const optimalBreakdown = getOptimalBillBreakdown(correctTotalValue);
                let billBreakdownCorrect = true;
                for (const bill of billDenominations) {
                    const userCount = parseInt(document.getElementById(`bill${bill}`).value) || 0;
                    if (userCount !== optimalBreakdown[bill]) {
                        billBreakdownCorrect = false;
                        break;
                    }
                }

                if (!billBreakdownCorrect) {
                    isCorrect = false;
                    message += 'Your bill breakdown is not optimal. ';
                    message += 'Optimal breakdown: ';
                    billDenominations.forEach(bill => {
                        if (optimalBreakdown[bill] > 0) {
                            message += `$${bill}x${optimalBreakdown[bill]} `;
                        }
                    });
                }
            }


            if (isCorrect) {
                displayMessage('🎉 Correct! Great job!', true);
                correctAnswers++;
            } else {
                if (message === '') { // Fallback if no specific error message was generated
                    message = 'Something is incorrect. Please review your entries.';
                }
                displayMessage(`❌ Incorrect. ${message}`, false);
                incorrectAnswers++;
            }

            // Update statistics display after each check
            updateStatisticsDisplay();
        });

        /**
         * Event handler for the Reset button.
         */
        resetButton.addEventListener('click', () => {
            clearInputs();
            generateNewRound();
            // Note: Reset button does not reset the statistics, only the current game.
            // If you want to reset statistics, you'd add:
            // gamesPlayed = 0; correctAnswers = 0; incorrectAnswers = 0; updateStatisticsDisplay();
        });

        // Initialize the app when the page loads
        window.onload = () => {
            generateNewRound();
            updateStatisticsDisplay(); // Show initial zeros for statistics
        };
    </script>
</body>
</html>
